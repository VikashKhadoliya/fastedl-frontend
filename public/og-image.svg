<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#635BFF"/>
      <stop offset="50%" stop-color="#7547F7"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#635BFF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="arrowBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="85%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="cyanVelocity" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="bracketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="badgeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
    </filter>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Dark Canvas -->
  <rect width="1200" height="630" fill="#0F172A"/>

  <!-- Ambient Glow Spots -->
  <circle cx="320" cy="240" r="280" fill="#635BFF" fill-opacity="0.16" filter="url(#glow)"/>
  <circle cx="880" cy="340" r="240" fill="#06B6D4" fill-opacity="0.10" filter="url(#glow)"/>

  <!-- Framing Card Border -->
  <rect x="40" y="40" width="1120" height="550" rx="28" stroke="#334155" stroke-width="2"/>

  <!-- Logo Emblem (130x130) -->
  <g transform="translate(130, 160) scale(2.03125)">
    <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#brandGrad)"/>
    <rect x="2.5" y="2.5" width="59" height="59" rx="15.5" stroke="url(#badgeBorder)" stroke-width="1.25"/>

    <!-- Top-Left Media Framing Bracket -->
    <path d="M 22 15 H 17 C 14.79 15 13 16.79 13 19 V 24" 
          stroke="url(#bracketGrad)" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Top-Right Media Framing Bracket -->
    <path d="M 42 15 H 47 C 49.21 15 51 16.79 51 19 V 24" 
          stroke="url(#bracketGrad)" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Bottom Media Cradle / Dock -->
    <path d="M 13 38 V 43 C 13 45.21 14.79 47 17 47 H 47 C 49.21 47 51 45.21 51 43 V 38" 
          stroke="url(#bracketGrad)" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Cyan Velocity Dock Accent -->
    <rect x="23" y="45.75" width="18" height="2.5" rx="1.25" fill="url(#cyanVelocity)"/>

    <!-- Dynamic Speed Arrow -->
    <g filter="url(#badgeShadow)">
      <path d="M 31.1 41.3 C 31.5 41.8 32.5 41.8 32.9 41.3 L 42.6 29.8 C 43.3 29 42.7 27.75 41.7 27.75 L 36.5 27.75 V 16.5 C 36.5 15.67 35.83 15 35 15 H 29 C 28.17 15 27.5 15.67 27.5 16.5 V 27.75 L 22.3 27.75 C 21.3 27.75 20.7 29 21.4 29.8 Z" 
            fill="url(#arrowBodyGrad)"/>
      <line x1="32" y1="18" x2="32" y2="30" stroke="#06B6D4" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Brand Wordmark & Typography -->
  <g transform="translate(290, 215)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="92" font-weight="900" fill="#FFFFFF" letter-spacing="-2.5">
      Fast<tspan fill="url(#textGrad)">EDL</tspan>
    </text>
    <circle cx="435" cy="-28" r="9" fill="#06B6D4"/>
    <!-- Subtitle -->
    <text y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#F8FAFC" letter-spacing="-0.5">
      Instagram Media Downloader
    </text>
    <!-- Full Name -->
    <text y="96" font-family="monospace, sans-serif" font-size="17" font-weight="600" fill="#8B5CF6" letter-spacing="1.5">
      FAST EASY DOWNLOAD LINK • REELS, VIDEOS, PHOTOS &amp; STORIES
    </text>
  </g>

  <!-- Feature Pills -->
  <g transform="translate(130, 440)">
    <g transform="translate(0, 0)">
      <rect width="230" height="48" rx="24" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <text x="115" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC" text-anchor="middle">1080p Original Quality</text>
    </g>
    <g transform="translate(250, 0)">
      <rect width="280" height="48" rx="24" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <text x="140" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC" text-anchor="middle">Safe &amp; Private (No Login)</text>
    </g>
    <g transform="translate(550, 0)">
      <rect width="280" height="48" rx="24" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <text x="140" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC" text-anchor="middle">iPhone, Android &amp; Desktop</text>
    </g>
  </g>
</svg>